<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1260" width="1660" height="1260"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#142a40" flood-opacity=".07"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#283c4d} .small{font-size:13px;fill:#667b88} .label{font-size:14px;text-anchor:middle;dominant-baseline:central} .line{fill:none;stroke-width:2}</style><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3e6db1"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#30816a"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bc7831"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c9aa4"/></marker></defs><rect width="1660" height="1260" fill="#f6f8fa"/><text x="40" y="48" font-size="29" text-anchor="start" font-weight="650">CPclaw 桌面对话 · 信息流传递关系</text><text x="40" y="78" font-size="14" text-anchor="start">基线：本机已安装 0.0.5 ｜2026-10-23 核对客户端文件与平台接口代码｜非未来架构</text><rect x="30" y="105" width="990" height="96" rx="12" fill="#eaf0f7"/><rect x="1040" y="105" width="265" height="96" rx="12" fill="#e8f2ed"/><rect x="1325" y="105" width="305" height="96" rx="12" fill="#f5eee5"/><text x="52" y="130" font-size="14" text-anchor="start" font-weight="600">本机桌面应用</text><text x="1060" y="130" font-size="14" text-anchor="start" font-weight="600">企业云平台</text><text x="1345" y="130" font-size="14" text-anchor="start" font-weight="600">模型供应商</text><rect x="38" y="142" width="204" height="48" rx="12" fill="#fff" stroke="#dce4eb"/><text x="140" y="162" font-size="15" text-anchor="middle" font-weight="600">对话界面</text><text x="140" y="180" font-size="11" text-anchor="middle">renderer/chat.js</text><path d="M140 207V990" stroke="#d4dde5" stroke-dasharray="4 6"/><rect x="293" y="142" width="204" height="48" rx="12" fill="#fff" stroke="#dce4eb"/><text x="395" y="162" font-size="15" text-anchor="middle" font-weight="600">安全桥接 / 主进程</text><text x="395" y="180" font-size="11" text-anchor="middle">preload → main → client</text><path d="M395 207V990" stroke="#d4dde5" stroke-dasharray="4 6"/><rect x="568" y="142" width="204" height="48" rx="12" fill="#fff" stroke="#dce4eb"/><text x="670" y="162" font-size="15" text-anchor="middle" font-weight="600">Node 工作进程</text><text x="670" y="180" font-size="11" text-anchor="middle">worker → chat-service</text><path d="M670 207V990" stroke="#d4dde5" stroke-dasharray="4 6"/><rect x="808" y="142" width="204" height="48" rx="12" fill="#fff" stroke="#dce4eb"/><text x="910" y="162" font-size="15" text-anchor="middle" font-weight="600">本机存储</text><text x="910" y="180" font-size="11" text-anchor="middle">chat.sqlite / 文件</text><path d="M910 207V990" stroke="#d4dde5" stroke-dasharray="4 6"/><rect x="1070" y="142" width="204" height="48" rx="12" fill="#fff" stroke="#dce4eb"/><text x="1172" y="162" font-size="15" text-anchor="middle" font-weight="600">平台模型接口</text><text x="1172" y="180" font-size="11" text-anchor="middle">鉴权 · 额度 · 流转发</text><path d="M1172 207V990" stroke="#d4dde5" stroke-dasharray="4 6"/><rect x="1373" y="142" width="204" height="48" rx="12" fill="#fff" stroke="#dce4eb"/><text x="1475" y="162" font-size="15" text-anchor="middle" font-weight="600">MiniMax-M3</text><text x="1475" y="180" font-size="11" text-anchor="middle">供应商 API / SSE</text><path d="M1475 207V990" stroke="#d4dde5" stroke-dasharray="4 6"/><path d="M140 240H395" class="line" stroke="#3e6db1" marker-end="url(#blue)"/><rect x="145.0" y="212" width="245" height="22" rx="6" fill="#fff"/><text x="267.5" y="228" font-size="13" text-anchor="middle">① chat.send：文本 + chatId + requestId</text><path d="M395 295H670" class="line" stroke="#3e6db1" marker-end="url(#blue)"/><rect x="400.0" y="267" width="265" height="22" rx="6" fill="#fff"/><text x="532.5" y="283" font-size="13" text-anchor="middle">② stdin JSON：补入 actorId</text><path d="M670 350H910" class="line" stroke="#3e6db1" marker-end="url(#blue)"/><rect x="675.0" y="322" width="230" height="22" rx="6" fill="#fff"/><text x="790.0" y="338" font-size="13" text-anchor="middle">③ 用户消息 + streaming 占位</text><path d="M910 403H670" class="line" stroke="#8c9aa4" marker-end="url(#gray)" stroke-dasharray="7 5"/><rect x="682.5" y="375" width="215" height="22" rx="6" fill="#fff"/><text x="790.0" y="391" font-size="13" text-anchor="middle">读取成功问答 / 可选文档原文</text><path d="M670 458H1172" class="line" stroke="#3e6db1" marker-end="url(#blue)"/><rect x="742.0" y="430" width="358" height="22" rx="6" fill="#fff"/><text x="921.0" y="446" font-size="13" text-anchor="middle">④ POST /v1/session/refresh</text><path d="M1172 503H670" class="line" stroke="#8c9aa4" marker-end="url(#gray)" stroke-dasharray="7 5"/><rect x="787.5" y="475" width="267" height="22" rx="6" fill="#fff"/><text x="921.0" y="491" font-size="13" text-anchor="middle">返回访问令牌；本机保存轮换后的刷新令牌</text><path d="M670 558H1172" class="line" stroke="#3e6db1" marker-end="url(#blue)"/><rect x="675.0" y="530" width="492" height="22" rx="6" fill="#fff"/><text x="921.0" y="546" font-size="13" text-anchor="middle">⑤ POST /v1/chat/stream：messages + Bearer</text><path d="M1172 613H1475" class="line" stroke="#3e6db1" marker-end="url(#blue)"/><rect x="1190.0" y="585" width="267" height="22" rx="6" fill="#fff"/><text x="1323.5" y="601" font-size="13" text-anchor="middle">⑥ /chat/completions</text><path d="M1475 668H1172" class="line" stroke="#30816a" marker-end="url(#green)"/><rect x="1190.0" y="640" width="267" height="22" rx="6" fill="#fff"/><text x="1323.5" y="656" font-size="13" text-anchor="middle">⑦ SSE：delta.content</text><path d="M1172 723H670" class="line" stroke="#30816a" marker-end="url(#green)"/><rect x="675.0" y="695" width="492" height="22" rx="6" fill="#fff"/><text x="921.0" y="711" font-size="13" text-anchor="middle">⑧ NDJSON：start / delta / done / error</text><path d="M670 778H910" class="line" stroke="#30816a" marker-end="url(#green)"/><rect x="682.5" y="750" width="215" height="22" rx="6" fill="#fff"/><text x="790.0" y="766" font-size="13" text-anchor="middle">⑨ 增量节流保存约 200ms</text><path d="M670 833H395" class="line" stroke="#30816a" marker-end="url(#green)"/><rect x="400.0" y="805" width="265" height="22" rx="6" fill="#fff"/><text x="532.5" y="821" font-size="13" text-anchor="middle">⑩ stdout JSON：{ event }</text><path d="M395 888H140" class="line" stroke="#30816a" marker-end="url(#green)"/><rect x="145.0" y="860" width="245" height="22" rx="6" fill="#fff"/><text x="267.5" y="876" font-size="13" text-anchor="middle">⑪ chat.event → 当前消息更新</text><path d="M670 943H910" class="line" stroke="#30816a" marker-end="url(#green)"/><rect x="675.0" y="915" width="230" height="22" rx="6" fill="#fff"/><text x="790.0" y="931" font-size="13" text-anchor="middle">⑫ 完整终态 / 可选 .md 成果</text><rect x="35" y="1005" width="1590" height="105" rx="12" fill="#fff5e8" stroke="#efdec4"/><text x="55" y="1031" font-size="16" text-anchor="start" font-weight="600">停止 / 异常支路</text><path d="M140 1076H670" class="line" stroke="#bc7831" marker-end="url(#orange)" stroke-dasharray="7 5"/><rect x="174.0" y="1048" width="462" height="22" rx="6" fill="#fff"/><text x="405.0" y="1064" font-size="13" text-anchor="middle">界面 chat.cancel → 同一 IPC / stdin 通道</text><path d="M670 1076H1172" class="line" stroke="#bc7831" marker-end="url(#orange)" stroke-dasharray="7 5"/><rect x="690.0" y="1048" width="462" height="22" rx="6" fill="#fff"/><text x="921.0" y="1064" font-size="13" text-anchor="middle">AbortController：中断 fetch / HTTP 连接</text><path d="M1172 1076H1475" class="line" stroke="#bc7831" marker-end="url(#orange)" stroke-dasharray="7 5"/><rect x="1255.0" y="1048" width="137" height="22" rx="6" fill="#fff"/><text x="1323.5" y="1064" font-size="13" text-anchor="middle">断连取消供应商调用</text><rect x="35" y="1130" width="780" height="95" rx="12" fill="#fff" stroke="#e1e7ed"/><rect x="835" y="1130" width="790" height="95" rx="12" fill="#fff" stroke="#e1e7ed"/><text x="55" y="1155" font-size="15" text-anchor="start" font-weight="600">上下文与本地结果</text><text x="55" y="1180" font-size="13" text-anchor="start">当前问题 + 最近完整问答；已选技能注入方法，文档修改可附原文。</text><text x="55" y="1204" font-size="13" text-anchor="start">取消/失败保留部分正文；仅完整结束后创建文档，重启标记未完成回复。</text><text x="855" y="1155" font-size="15" text-anchor="start" font-weight="600">凭证与版本边界</text><text x="855" y="1180" font-size="13" text-anchor="start">刷新令牌在本机账号目录；供应商 API Key 在平台，界面不持有。</text><text x="855" y="1204" font-size="13" text-anchor="start">源码 0.0.6 新增 document 工具事件；未计入本机 0.0.5 的正常协议。</text></svg>